<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- xyo Windows package: fontconfig for librsvg/Pango (<text> in SVG
     costumes). xyo sets FONTCONFIG_FILE to this file at startup when it
     sits in etc/fonts/ next to the executable. Do not edit the structure
     without updating winInit() in src/shell/main.cpp. -->
<fontconfig>
  <!-- Bundled Liberation fonts (OFL), resolved relative to this file. -->
  <dir prefix="relative">../../fonts</dir>
  <!-- Windows system fonts (Segoe UI, Yu Gothic, MS Gothic, ...). -->
  <dir>WINDOWSFONTDIR</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Prefer the bundled font for sans-serif so text metrics match the
       Linux/macOS builds that resolve to Liberation/DejaVu Sans. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
