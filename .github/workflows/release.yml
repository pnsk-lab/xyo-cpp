name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # リリースは Ubuntu 同梱の LLVM 18（静的アーカイブ付き）で静的リンクする。
  LLVM_STATIC: "18"

jobs:
  linux:
    name: Linux / JIT + SDL2 + librsvg
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        with:
          llvm: ${{ env.LLVM_STATIC }}
          extra: libzstd-dev libxml2-dev libncurses-dev libsdl2-dev librsvg2-dev libgl-dev glslc

      - name: Configure + build（Release / LLVM は静的リンク）
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_BUILD_TESTS=OFF \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_STATIC}/bin/llvm-config" \
            -DXYO_REQUIRE_SDL2=ON \
            -DXYO_STATIC_LLVM=ON
          cmake --build build -j"$(nproc)"
          echo "--- libLLVM に依存していないこと ---"
          readelf -d build/xyo | grep -c "libLLVM" | grep -q "^0$"

      - name: Smoke（run / AOT / play）
        run: |
          bash tools/ci/smoke.sh run build/xyo
          bash tools/ci/smoke.sh play build/xyo

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf dist/xyo-linux-x86_64.tar.gz \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-dist
          path: dist/xyo-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-static:
    name: Linux / 完全静的（headless）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        with:
          llvm: ${{ env.LLVM_STATIC }}
          extra: libzstd-dev libxml2-dev libncurses-dev

      - name: Configure + build（-static / SDL2 なし）
        run: |
          cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_STATIC}/bin/llvm-config" \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF
          cmake --build build-static -j"$(nproc)"
          test "$(readelf -d build-static/xyo | grep -c NEEDED)" = "0"

      - name: Smoke（run / AOT）
        run: bash tools/ci/smoke.sh run build-static/xyo

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-static/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf dist/xyo-linux-x86_64-static.tar.gz \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-static-dist
          path: dist/xyo-linux-x86_64-static.tar.gz
          if-no-files-found: error

  windows:
    name: Windows / JIT + SDL2（完全静的）
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-SDL2

      - name: Configure + build（JIT / SDL2・LLVM・libstdc++ 静的）
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_JIT=ON -DXYO_LLVM_MODE=llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=ON -DXYO_REQUIRE_SDL2=ON \
            -DXYO_BUILD_TESTS=OFF
          cmake --build build-win -j"$(nproc)"
          strip -s build-win/xyo.exe
          ls -la build-win/xyo.exe
          echo "--- SDL2.dll に依存していないこと（静的リンク） ---"
          objdump -p build-win/xyo.exe | grep -ci "DLL Name: SDL2.dll" | grep -q "^0$"

      - name: Smoke（run / AOT / play）
        run: |
          bash tools/ci/smoke.sh run build-win/xyo.exe --jit-log
          bash tools/ci/smoke.sh play build-win/xyo.exe

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-win/xyo.exe dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          (cd dist/pkg && zip -q "../xyo-windows-x86_64.zip" xyo.exe LICENSE RUNNING.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: windows-dist
          path: dist/xyo-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, linux-static, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: チェックサム
        run: |
          cd dist
          sha256sum xyo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: xyo-cpp ${{ github.ref_name }}
          files: |
            dist/xyo-linux-x86_64.tar.gz
            dist/xyo-linux-x86_64-static.tar.gz
            dist/xyo-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
