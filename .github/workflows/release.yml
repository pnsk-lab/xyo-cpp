name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux リリースビルド
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（LLVM 18 静的 + SDL2 + librsvg + glslc）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            llvm-18-dev llvm-18 \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev \
            libsdl2-dev librsvg2-dev libgl-dev glslc

      - name: Configure + build (Release / LLVM は静的リンク)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_BUILD_TESTS=OFF \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config \
            -DXYO_REQUIRE_SDL2=ON \
            -DXYO_STATIC_LLVM=ON
          cmake --build build -j"$(nproc)"
          echo "--- libLLVM に依存していないこと ---"
          readelf -d build/xyo | grep -c "libLLVM" | grep -q "^0$"

      - name: Smoke（リリースバイナリで run / play / AOT）
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./build/xyo run examples/play_demo.sb3 --frames 30
          XYO_EXIT_FRAMES=10 XYO_SHOT=shot.ppm ./build/xyo play examples/play_demo.sb3
          test -s shot.ppm
          ./build/xyo aot examples/play_demo.sb3 -o demo-app
          ./demo-app run --frames 30

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf "dist/xyo-linux-x86_64.tar.gz" \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-dist
          path: dist/xyo-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-static:
    name: Linux 完全静的ビルド（headless）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（静的ライブラリ）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            llvm-18-dev llvm-18 \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev

      - name: Configure + build（-static / SDL2 なし）
        run: |
          cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF
          cmake --build build-static -j"$(nproc)"
          test "$(readelf -d build-static/xyo | grep -c NEEDED)" = "0"

      - name: Smoke（リリースバイナリで run / AOT）
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./build-static/xyo run examples/play_demo.sb3 --frames 30
          ./build-static/xyo aot examples/play_demo.sb3 -o static-app
          ./static-app run --frames 30 2>jit-err.txt
          if grep -q "JIT session error" jit-err.txt; then
            echo "==== JIT シンボル解決に失敗 ===="; cat jit-err.txt; exit 1
          fi

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-static/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf "dist/xyo-linux-x86_64-static.tar.gz" \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-static-dist
          path: dist/xyo-linux-x86_64-static.tar.gz
          if-no-files-found: error


  windows:
    name: Windows リリースビルド（JIT / SDL2 / 完全静的）
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            zip
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-SDL2

      - name: Configure + build（JIT 有効 / SDL2・LLVM・libstdc++ 静的）
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_JIT=ON -DXYO_LLVM_MODE=llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=ON -DXYO_REQUIRE_SDL2=ON \
            -DXYO_BUILD_TESTS=OFF
          cmake --build build-win -j"$(nproc)"
          strip -s build-win/xyo.exe
          ls -la build-win/xyo.exe
          echo "--- SDL2.dll に依存していないこと（静的リンク） ---"
          objdump -p build-win/xyo.exe | grep -ci "DLL Name: SDL2.dll" | grep -q "^0$"

      - name: Smoke（JIT で run / AOT 書き出し / play）
        run: |
          ./build-win/xyo.exe run examples/play_demo.sb3 --frames 30
          echo "--- JIT コンパイル数 ---"
          XYO_JIT_VERBOSE=1 ./build-win/xyo.exe run examples/play_demo.sb3 --frames 10 2>&1 | grep -c "compiled" || true
          ./build-win/xyo.exe aot examples/play_demo.sb3 -o app.exe
          ./app.exe run --frames 30 2>jit-err.txt
          if grep -q "JIT session error" jit-err.txt; then
            echo "==== JIT シンボル解決に失敗 ===="; cat jit-err.txt; exit 1
          fi
          echo "--- play（dummy ドライバ） ---"
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          XYO_EXIT_FRAMES=10 XYO_SHOT=shot.ppm ./build-win/xyo.exe play examples/play_demo.sb3
          test -s shot.ppm && ls -l shot.ppm

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-win/xyo.exe dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          (cd dist/pkg && zip -q "../xyo-windows-x86_64.zip" xyo.exe LICENSE RUNNING.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: windows-dist
          path: dist/xyo-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: GitHub Release 作成
    needs: [linux, linux-static, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: チェックサム
        run: |
          cd dist
          sha256sum xyo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: xyo-cpp ${{ github.ref_name }}
          files: |
            dist/xyo-linux-x86_64.tar.gz
            dist/xyo-linux-x86_64-static.tar.gz
            dist/xyo-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
