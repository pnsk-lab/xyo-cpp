name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux リリースビルド
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（LLVM 18 静的 + SDL2 + librsvg + glslc）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            llvm-18-dev llvm-18 \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev \
            libsdl2-dev librsvg2-dev libgl-dev glslc

      - name: Configure + build (Release / LLVM は静的リンク)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_BUILD_TESTS=OFF \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config \
            -DXYO_STATIC_LLVM=ON
          cmake --build build -j"$(nproc)"
          echo "--- libLLVM に依存していないこと ---"
          readelf -d build/xyo | grep -c "libLLVM" | grep -q "^0$"

      - name: Smoke（リリースバイナリで run / play / AOT）
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./build/xyo run examples/play_demo.sb3 --frames 30
          XYO_EXIT_FRAMES=10 XYO_SHOT=shot.ppm ./build/xyo play examples/play_demo.sb3
          test -s shot.ppm
          ./build/xyo aot examples/play_demo.sb3 -o demo-app
          ./demo-app run --frames 30

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf "dist/xyo-linux-x86_64.tar.gz" \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-dist
          path: dist/xyo-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-static:
    name: Linux 完全静的ビルド（headless）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（静的ライブラリ）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            llvm-18-dev llvm-18 \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev

      - name: Configure + build（-static / SDL2 なし）
        run: |
          cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF
          cmake --build build-static -j"$(nproc)"
          test "$(readelf -d build-static/xyo | grep -c NEEDED)" = "0"

      - name: Smoke（リリースバイナリで run / AOT）
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./build-static/xyo run examples/play_demo.sb3 --frames 30
          ./build-static/xyo aot examples/play_demo.sb3 -o static-app
          ./static-app run --frames 30 2>jit-err.txt
          if grep -q "JIT session error" jit-err.txt; then
            echo "==== JIT シンボル解決に失敗 ===="; cat jit-err.txt; exit 1
          fi

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-static/xyo dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          tar -C dist/pkg -czf "dist/xyo-linux-x86_64-static.tar.gz" \
            xyo LICENSE RUNNING.txt
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux-static-dist
          path: dist/xyo-linux-x86_64-static.tar.gz
          if-no-files-found: error


  windows:
    name: Windows リリースビルド（zig クロス）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: zig 0.15.1
        run: |
          curl -sL -o zig.tar.xz \
            https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.1" >>"$GITHUB_PATH"
          ./zig-x86_64-linux-0.15.1/zig version

      - name: Windows 用 zlib
        run: |
          mkdir -p .windeps
          curl -sL -o .windeps/zlib.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf .windeps/zlib.tar.gz -C .windeps
          cmake -B .windeps/zlib-build -S .windeps/zlib-1.3.1 \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .windeps/zlib-build --target zlibstatic -j"$(nproc)"
          mkdir -p .windeps/zlib/lib .windeps/zlib/include
          cp .windeps/zlib-build/libzlibstatic.a .windeps/zlib/lib/
          cp .windeps/zlib-1.3.1/zlib.h .windeps/zlib-build/zconf.h \
            .windeps/zlib/include/

      - name: Configure + build xyo.exe
        run: |
          cmake -B build-win \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DXYO_JIT=OFF -DXYO_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_LIBRARY="$PWD/.windeps/zlib/lib/libzlibstatic.a" \
            -DZLIB_INCLUDE_DIR="$PWD/.windeps/zlib/include"
          cmake --build build-win -j"$(nproc)"
          file build-win/xyo.exe

      - name: パッケージ
        run: |
          mkdir -p dist/pkg
          cp build-win/xyo.exe dist/pkg/
          cp LICENSE dist/pkg/
          cp RUNNING.md dist/pkg/RUNNING.txt
          (cd dist/pkg && zip -q "../xyo-windows-x86_64.zip" xyo.exe LICENSE RUNNING.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: windows-dist
          path: dist/xyo-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: GitHub Release 作成
    needs: [linux, linux-static, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: チェックサム
        run: |
          cd dist
          sha256sum xyo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: xyo-cpp ${{ github.ref_name }}
          files: |
            dist/xyo-linux-x86_64.tar.gz
            dist/xyo-linux-x86_64-static.tar.gz
            dist/xyo-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
