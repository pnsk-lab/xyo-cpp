name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MAJOR: "23"

jobs:
  linux:
    name: Linux (JIT / SDL2 / Vulkan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（LLVM 23, SDL2, librsvg, glslc）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zlib1g-dev \
            libsdl2-dev librsvg2-dev libgl-dev glslc \
            wget gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "llvm-${LLVM_MAJOR}-dev"
          "/usr/lib/llvm-${LLVM_MAJOR}/bin/llvm-config" --version

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_MAJOR}/bin/llvm-config"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke（headless run / play / AOT 書き出し）
        run: |
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          echo "--- run ---"
          ./build/xyo run examples/play_demo.sb3 --frames 30
          echo "--- play (dummy) ---"
          XYO_EXIT_FRAMES=10 XYO_SHOT=shot.ppm ./build/xyo play examples/play_demo.sb3
          test -s shot.ppm && ls -l shot.ppm
          echo "--- AOT ---"
          ./build/xyo aot examples/play_demo.sb3 -o demo-app
          ./demo-app run --frames 30

      - name: 失敗時のテストログ
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 完全静的（headless）: LLVM 18 の静的アーカイブ + 静的 libstdc++。
  # 動的依存ゼロのバイナリを作る（Ubuntu の llvm-18-dev は .a を同梱する）。
  linux-static:
    name: Linux 完全静的（headless / 依存ゼロ）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 依存パッケージ（静的ライブラリ）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            llvm-18-dev llvm-18 \
            zlib1g-dev libzstd-dev libxml2-dev libncurses-dev

      - name: Configure（-static / 静的 LLVM / SDL2 なし）
        run: |
          cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-static -j"$(nproc)"

      - name: 静的リンクの確認とスモーク
        run: |
          echo "--- 動的依存（NEEDED） ---"
          readelf -d build-static/xyo | grep NEEDED || echo "NEEDED なし = 完全静的"
          test "$(readelf -d build-static/xyo | grep -c NEEDED)" = "0"
          file build-static/xyo
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./build-static/xyo run examples/play_demo.sb3 --frames 30
          ./build-static/xyo aot examples/play_demo.sb3 -o static-app
          # 静的リンクでは ORC が dlsym で libcall を解決できないため、
          # fmod/log/bcmp 等の未解決が起きていないことを確認する
          ./static-app run --frames 30 2>jit-err.txt
          if grep -q "JIT session error" jit-err.txt; then
            echo "==== JIT シンボル解決に失敗 ===="; cat jit-err.txt; exit 1
          fi

  # Windows で JIT を有効にする（MSYS2 の mingw-w64 LLVM を使う）。
  # zig クロスでは LLVM for Windows が無いため interp のみだった。
  windows-jit:
    name: Windows JIT（MSYS2 mingw LLVM）
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-zlib

      - name: LLVM の確認（静的アーカイブの有無）
        run: |
          llvm-config --version
          ls /mingw64/lib/cmake/llvm/LLVMConfig.cmake
          echo "--- 静的アーカイブ ---"
          ls /mingw64/lib/libLLVM*.a 2>/dev/null | head -5 || echo "(なし)"
          echo "--- --link-static --libs ---"
          llvm-config --link-static --libs core orcjit native passes 2>&1 | head -c 300
          echo

      - name: Configure + build（JIT 有効）
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_JIT=ON -DXYO_LLVM_MODE=config \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF
          cmake --build build-win -j"$(nproc)"
          ls -la build-win/xyo.exe

      - name: スモーク（JIT が実際にコンパイルすること / AOT）
        run: |
          ./build-win/xyo.exe run examples/play_demo.sb3 --frames 30
          echo "--- JIT コンパイル数 ---"
          XYO_JIT_VERBOSE=1 ./build-win/xyo.exe run examples/play_demo.sb3 --frames 10 2>&1 | grep -c "compiled" || true
          ./build-win/xyo.exe aot examples/play_demo.sb3 -o app.exe
          ./app.exe run --frames 30 2>jit-err.txt
          if grep -q "JIT session error" jit-err.txt; then
            echo "==== JIT シンボル解決に失敗 ===="; cat jit-err.txt; exit 1
          fi

  windows:
    name: Windows (zig クロス、headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: zig 0.15.1
        run: |
          curl -sL -o zig.tar.xz \
            https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.1" >>"$GITHUB_PATH"
          ./zig-x86_64-linux-0.15.1/zig version

      - name: Windows 用 zlib
        run: |
          mkdir -p .windeps
          curl -sL -o .windeps/zlib.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf .windeps/zlib.tar.gz -C .windeps
          cmake -B .windeps/zlib-build -S .windeps/zlib-1.3.1 \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .windeps/zlib-build --target zlibstatic -j"$(nproc)"
          mkdir -p .windeps/zlib/lib .windeps/zlib/include
          cp .windeps/zlib-build/libzlibstatic.a .windeps/zlib/lib/
          cp .windeps/zlib-1.3.1/zlib.h .windeps/zlib-build/zconf.h \
            .windeps/zlib/include/

      - name: Configure + build xyo.exe
        run: |
          cmake -B build-win \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DXYO_JIT=OFF -DXYO_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_LIBRARY="$PWD/.windeps/zlib/lib/libzlibstatic.a" \
            -DZLIB_INCLUDE_DIR="$PWD/.windeps/zlib/include"
          cmake --build build-win -j"$(nproc)"
          file build-win/xyo.exe
