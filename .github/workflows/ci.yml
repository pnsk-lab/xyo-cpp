name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 動的リンクの Linux ジョブは apt.llvm.org の最新版で検証する（llvm_compat が
  # LLVM 18〜23 の API 差を吸収する）。静的リンクは Ubuntu 同梱の 18 を使う —
  # 静的アーカイブを同梱しているのは Ubuntu の llvm-18-dev だけのため。
  LLVM_LATEST: "23"
  LLVM_STATIC: "18"

jobs:
  linux:
    name: Linux / JIT + SDL2 + Vulkan + librsvg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        with:
          llvm: ${{ env.LLVM_LATEST }}
          llvm_apt: "true"
          extra: libsdl2-dev librsvg2-dev libgl-dev glslc

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_LATEST}/bin/llvm-config" \
            -DXYO_REQUIRE_SDL2=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke（run / AOT / play）
        run: |
          bash tools/ci/smoke.sh run build/xyo
          bash tools/ci/smoke.sh play build/xyo

      - name: 失敗時のテストログ
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 動的依存ゼロのバイナリ（LLVM 18 の静的アーカイブ + 静的 libstdc++）。
  linux-static:
    name: Linux / 完全静的（headless・依存ゼロ）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        with:
          llvm: ${{ env.LLVM_STATIC }}
          extra: libzstd-dev libxml2-dev libncurses-dev

      - name: Configure（-static / 静的 LLVM / SDL2 なし）
        run: |
          cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_STATIC}/bin/llvm-config" \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=OFF -DXYO_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-static -j"$(nproc)"

      - name: 動的依存が無いことを確認
        run: |
          readelf -d build-static/xyo | grep NEEDED || echo "NEEDED なし = 完全静的"
          test "$(readelf -d build-static/xyo | grep -c NEEDED)" = "0"
          file build-static/xyo

      - name: Smoke（run / AOT）
        run: bash tools/ci/smoke.sh run build-static/xyo

  # librsvg を持たないビルド = Windows と同じ SVG バックエンド（nanosvg）。
  # Windows では実行しにくいので、レンダラ回帰を Linux で常時検証する。
  linux-nanosvg:
    name: Linux / nanosvg フォールバック（SDL2）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        with:
          llvm: ${{ env.LLVM_STATIC }}
          extra: libgl-dev libsdl2-dev

      - name: Configure（-DXYO_RSVG=OFF）
        run: |
          cmake -B build-norsvg -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXYO_LLVM_MODE=llvm-config \
            -DLLVM_CONFIG="/usr/lib/llvm-${LLVM_STATIC}/bin/llvm-config" \
            -DXYO_RSVG=OFF -DXYO_REQUIRE_SDL2=ON

      - name: Build（レンダラ回帰テスト）
        run: cmake --build build-norsvg --target xyo-render-tests -j"$(nproc)"

      # ctest 経由で回す（テスト側の ENVIRONMENT = SDL dummy + XYO_JIT_MODE=eager
      # を効かせるため。直接実行すると HotSpot のままで isCompiled 検査が落ちる）。
      - name: レンダラ回帰（SDL dummy / nanosvg）
        run: ctest --test-dir build-norsvg -R xyo-render-tests --output-on-failure

  # Windows の JIT は MSYS2 の mingw-w64 LLVM（静的アーカイブ同梱）で検証する。
  # zig クロスでは LLVM for Windows が無く interp のみになるため。
  windows-jit:
    name: Windows / JIT + SDL2（MSYS2 mingw）
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-SDL2

      - name: ツールチェーンの確認
        run: |
          llvm-config --version
          ls /mingw64/lib/libLLVM*.a | head -3

      - name: Build（JIT + SDL2、動的リンク）
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_JIT=ON -DXYO_LLVM_MODE=config \
            -DXYO_SDL2=ON -DXYO_REQUIRE_SDL2=ON \
            -DXYO_BUILD_TESTS=OFF
          cmake --build build-win -j"$(nproc)"
          ls -l build-win/xyo.exe

      - name: Smoke（run / AOT / play）
        run: |
          bash tools/ci/smoke.sh run build-win/xyo.exe --jit-log
          bash tools/ci/smoke.sh play build-win/xyo.exe

      - name: Build（JIT + SDL2、完全静的）
        run: |
          cmake -B build-win-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYO_JIT=ON -DXYO_LLVM_MODE=llvm-config \
            -DXYO_STATIC=ON -DXYO_STATIC_LLVM=ON \
            -DXYO_SDL2=ON -DXYO_REQUIRE_SDL2=ON \
            -DXYO_BUILD_TESTS=OFF
          cmake --build build-win-static -j"$(nproc)"
          ls -l build-win-static/xyo.exe
          echo "--- SDL2.dll に依存していないこと（静的リンク） ---"
          objdump -p build-win-static/xyo.exe | grep -ci "DLL Name: SDL2.dll" | grep -q "^0$"

      - name: Smoke（完全静的 — run / play）
        run: |
          bash tools/ci/smoke.sh run build-win-static/xyo.exe
          bash tools/ci/smoke.sh play build-win-static/xyo.exe

  # LLVM for Windows が無い環境向けの zig クロス（interp のみ・headless）。
  windows-cross:
    name: Windows / zig クロス（interp・headless）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: zig 0.15.1
        run: |
          curl -sL -o zig.tar.xz \
            https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.1" >>"$GITHUB_PATH"
          ./zig-x86_64-linux-0.15.1/zig version

      - name: Windows 用 zlib
        run: |
          mkdir -p .windeps
          curl -sL -o .windeps/zlib.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf .windeps/zlib.tar.gz -C .windeps
          cmake -B .windeps/zlib-build -S .windeps/zlib-1.3.1 \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .windeps/zlib-build --target zlibstatic -j"$(nproc)"
          mkdir -p .windeps/zlib/lib .windeps/zlib/include
          cp .windeps/zlib-build/libzlibstatic.a .windeps/zlib/lib/
          cp .windeps/zlib-1.3.1/zlib.h .windeps/zlib-build/zconf.h \
            .windeps/zlib/include/

      - name: Build xyo.exe（XYO_JIT=OFF）
        run: |
          cmake -B build-win \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/zig-windows-x86_64.cmake" \
            -DXYO_JIT=OFF -DXYO_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_LIBRARY="$PWD/.windeps/zlib/lib/libzlibstatic.a" \
            -DZLIB_INCLUDE_DIR="$PWD/.windeps/zlib/include"
          cmake --build build-win -j"$(nproc)"
          file build-win/xyo.exe
